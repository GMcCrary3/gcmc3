# Content editor for GilesMcCrary.com (Decap CMS).
# Open https://gilesmccrary.com/admin/ and sign in with GitHub.
# Every save is a commit to the repository; the site rebuilds automatically.

backend:
  name: github
  repo: GMcCrary3/gcmc3
  # Private preview deploys from this branch; change to main if one is created later.
  branch: claude/gilesmccrary-website-2ingnt
  base_url: https://api.netlify.com   # Netlify provides the GitHub sign-in
  commit_messages:
    create: "add {{collection}} “{{slug}}”"
    update: "update {{collection}} “{{slug}}”"
    delete: "remove {{collection}} “{{slug}}”"
    uploadMedia: "upload “{{path}}”"
    deleteMedia: "delete “{{path}}”"

# For editing on your own computer: run `npm run cms` alongside `npm run dev`,
# then open http://localhost:4321/admin/
local_backend: true

# Changes are saved as drafts and published when approved.
publish_mode: editorial_workflow

site_url: https://gilesmccrary.com
display_url: https://gilesmccrary.com
logo_url: /favicon.svg

# Original (master) files are stored unaltered in the repository; the site
# makes optimised web copies at build time.
media_folder: src/assets/artwork
public_folder: /src/assets/artwork

collections:
  # ------------------------------------------------------------------
  - name: exhibition
    label: exhibition
    label_singular: movement
    description: "The five movements. Reorder works, add interludes, and pair poems with paintings here."
    folder: src/content/exhibition
    create: false
    delete: false
    slug: "{{order}}-{{slug}}"
    summary: "{{numeral}} · {{title}}"
    sortable_fields: [order]
    fields:
      - { label: "numeral", name: numeral, widget: string, hint: "I, II, III … (the prologue uses 0)" }
      - { label: "movement name", name: title, widget: string, hint: "A navigation label — not a title for any painting." }
      - { label: "order", name: order, widget: number, value_type: int }
      - label: "sequence"
        name: items
        widget: list
        required: false
        hint: "Drag to reorder. Visitors move through these in this order."
        types:
          - label: "painting"
            name: artwork
            widget: object
            summary: "{{fields.work}} {{fields.poem}}"
            fields:
              - { label: "painting", name: work, widget: relation, collection: artwork, value_field: "{{slug}}", search_fields: [ref, title], display_fields: ["no. {{ref}} {{title}}"] }
              - label: "poem visitors may reveal (optional)"
                name: poem
                widget: relation
                collection: writing
                value_field: "{{slug}}"
                search_fields: [title]
                display_fields: [title]
                required: false
                filters:
                  - { field: kind, values: [poetry, prose] }
          - label: "interlude (text between works)"
            name: interlude
            widget: object
            summary: "{{fields.label}} {{fields.text}}"
            fields:
              - { label: "small label (optional)", name: label, widget: string, required: false, hint: "e.g. interlude 01" }
              - { label: "text", name: text, widget: text, required: false }
              - { label: "source / note to editors", name: source, widget: string, required: false, hint: "Not shown to visitors." }
              - { label: "approved by the artist", name: approved, widget: boolean, default: false, hint: "Interludes stay hidden from visitors until this is on." }
          - label: "poem pairing placeholder"
            name: poem-slot
            widget: object
            fields:
              - { label: "note to editors", name: note, widget: string, required: false }
      - { label: "text (used for the closing words of the last movement)", name: body, widget: markdown, required: false }

  # ------------------------------------------------------------------
  - name: artwork
    label: artwork
    label_singular: work
    folder: src/content/artwork
    create: true
    slug: "work-{{fields.ref}}"
    identifier_field: ref
    summary: "no. {{ref}} {{title}}"
    sortable_fields: [ref, title]
    fields:
      - { label: "catalogue number", name: ref, widget: string, hint: "From the artist's index, e.g. 11. Shown as “no. 11” when there is no title. To split a work later, use 10a, 10b, 10c." }
      - { label: "original image file", name: image, widget: image, hint: "Upload the original photograph (JPEG/PNG, sRGB, ideally 2500px+). It is never cropped, filtered, or overlaid on its own page." }
      - { label: "image description (alt text)", name: alt, widget: text, required: false, hint: "What can be seen, for visitors using screen readers." }
      - { label: title, name: title, widget: string, required: false, hint: "Leave blank if untitled or undecided — blank fields are never published." }
      - { label: year, name: year, widget: string, required: false }
      - { label: medium, name: medium, widget: string, required: false }
      - { label: dimensions, name: dimensions, widget: string, required: false, hint: "e.g. 48 × 36 in." }
      - { label: "artist-approved description", name: description, widget: text, required: false }
      - { label: availability, name: availability, widget: string, required: false, hint: "Only shown when “show availability” is on in settings." }
      - label: "detail photographs"
        name: details
        widget: list
        required: false
        fields:
          - { label: image, name: image, widget: image }
          - { label: "description (alt text)", name: alt, widget: string, required: false }
          - { label: caption, name: caption, widget: string, required: false }
      - label: "works within this photograph"
        name: parts
        widget: list
        required: false
        hint: "For photographs that show several works together (e.g. no. 10). Keep them grouped here, or split them into their own entries."
        fields:
          - { label: "position or label", name: label, widget: string, required: false }
          - { label: "separate image (optional)", name: image, widget: image, required: false }
          - { label: "description (alt text)", name: alt, widget: string, required: false }
          - { label: note, name: note, widget: string, required: false }
      - { label: "hide (draft)", name: draft, widget: boolean, default: false, required: false }
      - { label: "interpretation or note (optional)", name: body, widget: markdown, required: false, buttons: [bold, italic, link, quote] }

  # ------------------------------------------------------------------
  - name: writing
    label: writing
    label_singular: writing
    folder: src/content/writing
    create: true
    slug: "{{slug}}"
    summary: "{{kind}} · {{title}}"
    media_folder: /src/assets/writing
    public_folder: /src/assets/writing
    view_groups:
      - { label: kind, field: kind }
    fields:
      - { label: title, name: title, widget: string, hint: "Exactly as it should appear, including capitalisation." }
      - label: kind
        name: kind
        widget: select
        options:
          - { label: book, value: book }
          - { label: poem, value: poetry }
          - { label: "prose / essay", value: prose }
          - { label: "publication (elsewhere)", value: publication }
      - { label: subtitle, name: subtitle, widget: string, required: false }
      - { label: "from the book (for poems and excerpts)", name: book, widget: relation, collection: writing, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false, filters: [{ field: kind, values: [book] }] }
      - { label: year, name: year, widget: string, required: false }
      - { label: publisher, name: publisher, widget: string, required: false }
      - { label: "short description", name: description, widget: text, required: false }
      - { label: "cover image", name: cover, widget: image, required: false }
      - { label: "cover description (alt text)", name: coverAlt, widget: string, required: false }
      - { label: "recorded reading (optional, never autoplays)", name: audio, widget: file, required: false, media_folder: /public/audio, public_folder: /audio }
      - label: links
        name: links
        widget: list
        required: false
        hint: "Published editions: a bookshop or publisher page."
        fields:
          - { label: label, name: label, widget: string }
          - { label: url, name: url, widget: string }
      - { label: order, name: order, widget: number, value_type: int, default: 100 }
      - { label: "hide (draft)", name: draft, widget: boolean, default: false, required: false }
      - { label: "awaiting the artist's review (private preview only)", name: review, widget: boolean, default: false, required: false }
      - { label: "source (book and pages; not shown)", name: source, widget: string, required: false }
      - { label: "invite readers' responses", name: responses, widget: boolean, default: false, required: false, hint: "Also add the poem to settings → works → responses → poems." }
      - label: "text"
        name: body
        widget: text
        required: false
        hint: "For poems, paste exactly. Every line break, blank line between stanzas, indent, and punctuation is kept. *Asterisks* make italics. For prose, Markdown is supported."

  # ------------------------------------------------------------------
  - name: pages
    label: site copy
    description: "The artist's own words for each page, shown exactly as written. Untick 'approved' to hide a section."
    files:
      - label: "homepage introduction"
        name: home
        file: src/content/pages/home.md
        fields: &copyfields
          - { label: title, name: title, widget: hidden }
          - { label: "approved", name: approved, widget: boolean, default: false, required: false }
          - { label: heading, name: heading, widget: string, required: false }
          - { label: "line under the heading", name: subheading, widget: string, required: false }
          - { label: "bold opening line", name: lead, widget: string, required: false }
          - { label: text, name: body, widget: markdown, required: false }
      - label: "about the artist"
        name: about
        file: src/content/pages/about.md
        fields:
          - { label: title, name: title, widget: hidden }
          - { label: "approved", name: approved, widget: boolean, default: false, required: false }
          - { label: heading, name: heading, widget: string, required: false }
          - { label: "text", name: body, widget: markdown, required: false }
          - { label: portrait, name: portrait, widget: image, required: false, media_folder: /src/assets/site, public_folder: /src/assets/site }
          - { label: "portrait description (alt text)", name: portraitAlt, widget: string, required: false }
          - label: publications
            name: publications
            widget: list
            required: false
            fields: &linkfields
              - { label: text, name: text, widget: string }
              - { label: "link (optional)", name: url, widget: string, required: false }
          - { label: exhibitions, name: exhibitions, widget: list, required: false, fields: *linkfields }
          - { label: press, name: press, widget: list, required: false, fields: *linkfields }
          - { label: "professional contact details", name: professionalContact, widget: text, required: false }
      - label: "selected works"
        name: selected_works
        file: src/content/pages/selected-works.md
        fields: *copyfields
      - label: "archive & process"
        name: archive
        file: src/content/pages/archive.md
        fields: *copyfields
      - label: "words (writing page)"
        name: words
        file: src/content/pages/words.md
        fields: *copyfields
      - label: "books (writing page)"
        name: books
        file: src/content/pages/books.md
        fields: *copyfields
      - label: "abstractly concrete (exhibition opening)"
        name: exhibition
        file: src/content/pages/exhibition.md
        fields: *copyfields
      - label: "the field"
        name: field
        file: src/content/pages/field.md
        fields: *copyfields
      - label: "contact"
        name: contact
        file: src/content/pages/contact.md
        fields: *copyfields
      - label: "the unfinished sentence (not yet shown)"
        name: unfinished_sentence
        file: src/content/pages/unfinished-sentence.md
        fields: *copyfields
      - label: "the space between us (not yet shown)"
        name: space_between_us
        file: src/content/pages/space-between-us.md
        fields: *copyfields
      - label: "participation: abstractly concrete"
        name: participation
        file: src/content/pages/participation.md
        fields: *copyfields
      - label: "unfinished sentence"
        name: sentence
        file: src/content/pages/sentence.md
        fields: *copyfields
      - label: "space in between us"
        name: between
        file: src/content/pages/between.md
        fields: *copyfields
      - label: "closing statement"
        name: closing
        file: src/content/pages/closing.md
        fields: *copyfields
      - label: "artist statement (shown only when approved)"
        name: statement
        file: src/content/pages/statement.md
        fields: *copyfields

  # ------------------------------------------------------------------
  - name: settings
    label: settings
    files:
      - label: site settings
        name: site
        file: src/data/site.json
        format: json
        fields:
          - { label: "site name", name: siteName, widget: string }
          - { label: byline, name: byline, widget: string }
          - { label: "role (under the byline)", name: role, widget: string }
          - { label: "footer sign-off", name: signoff, widget: string }
          - { label: concept, name: concept, widget: string }
          - { label: "secondary line", name: secondaryLine, widget: string }
          - { label: "opening statement", name: openingStatement, widget: text }
          - { label: "primary button", name: enterLabel, widget: string }
          - { label: "secondary button", name: exploreLabel, widget: string }
          - { label: "search & sharing description", name: description, widget: text }
          - { label: "public contact email (optional)", name: contactEmail, widget: string, required: false }
          - { label: "show editorial notes (turn off at launch)", name: showEditorialNotes, widget: boolean }
          - { label: "prelaunch: hide the whole site from search engines", name: prelaunch, widget: boolean, hint: "Keep on until launch is approved." }
          - { label: "show availability on artwork pages", name: showAvailability, widget: boolean }
          - label: hero
            name: hero
            widget: object
            fields:
              - { label: "artwork", name: artwork, widget: relation, collection: artwork, value_field: "{{slug}}", search_fields: [ref, title], display_fields: ["no. {{ref}} {{title}}"] }
              - { label: "crop focus (x% y%)", name: focus, widget: string, hint: "Which part of the painting stays visible in the homepage crop, e.g. 45% 50%." }
          - label: gallery
            name: gallery
            widget: object
            hint: "Order of the artwork page. Placement carries no judgement about a work's status."
            fields:
              - label: "selected works (drag to reorder)"
                name: selected
                widget: list
                field: { label: work, name: work, widget: relation, collection: artwork, value_field: "{{slug}}", search_fields: [ref, title], display_fields: ["no. {{ref}} {{title}}"] }
              - label: "second section (drag to reorder)"
                name: archive
                widget: list
                field: { label: work, name: work, widget: relation, collection: artwork, value_field: "{{slug}}", search_fields: [ref, title], display_fields: ["no. {{ref}} {{title}}"] }
              - { label: "second section heading", name: archiveTitle, widget: string }
          - label: "abstract your own concrete (visitor space)"
            name: abstractRoom
            widget: object
            fields:
              - { label: "page title", name: title, widget: string }
              - { label: prompt, name: prompt, widget: string }
              - { label: hint, name: hint, widget: string }
              - { label: "button", name: begin, widget: string }
              - { label: "when every letter is erased", name: empty, widget: string }
              - { label: "privacy line under the prompt", name: privacy, widget: string }
          - label: "the field (participatory artwork)"
            name: field
            widget: object
            fields:
              - { label: "open for new pieces", name: open, widget: boolean, hint: "Turn off to pause new pieces; the field stays visible." }
              - label: moderation
                name: moderation
                widget: select
                options:
                  - { label: "every piece waits for approval before appearing (recommended for launch)", value: pre }
                  - { label: "pieces appear at once; reported or flagged pieces are held for review", value: post }
              - { label: "participation terms version (change when the terms change)", name: termsVersion, widget: string }
              - { label: "section label", name: label, widget: string }
              - { label: title, name: title, widget: string }
              - { label: "invitation (exhibition and homepage; line breaks kept)", name: invitation, widget: text }
              - { label: "participation button", name: leave, widget: string }
              - { label: "collective view", name: seenAsOne, widget: string }
              - { label: "individual view", name: oneByOne, widget: string }
              - { label: "note on contributors", name: contributorNote, widget: text }
              - { label: "credit lines on shared images", name: creditLines, widget: list, field: { label: line, name: line, widget: string } }
          - label: "works: unfinished sentence and space in between us"
            name: works
            widget: object
            fields:
              - { label: "participation terms version (change when the terms change)", name: termsVersion, widget: string }
              - label: "interface copy (lowercase)"
                name: copy
                widget: object
                fields:
                  - { label: invitation, name: invitation, widget: text }
                  - { label: "submit button", name: submit, widget: string }
                  - { label: "published at once", name: success, widget: text }
                  - { label: "awaiting moderation", name: pending, widget: text }
                  - { label: "intervention milestone", name: milestone, widget: text }
                  - { label: "empty", name: empty, widget: text }
                  - { label: "error", name: error, widget: text }
              - label: "unfinished sentence"
                name: sentence
                widget: object
                fields:
                  - { label: "open for contributions", name: open, widget: boolean }
                  - { label: title, name: title, widget: string }
                  - { label: prompt, name: prompt, widget: string }
                  - label: "moderation (artist decision pending)"
                    name: moderation
                    widget: select
                    options:
                      - { label: "read before publishing", value: pre }
                      - { label: "publish at once (screened)", value: post }
                  - { label: "visitor contributions per intervention", name: every, widget: number, value_type: int }
                  - { label: "intervention window in days (meaning not yet approved)", name: windowDays, widget: number, value_type: int, required: false }
                  - label: "the window starts at (artist decision pending)"
                    name: windowStartsAt
                    widget: select
                    options:
                      - { label: "the milestone (when the twelfth is published)", value: milestone }
                      - { label: "approval of the twelfth contribution", value: approval }
                      - { label: "submission of the twelfth contribution", value: submission }
                  - { label: "show the window's end date publicly", name: showWindowPublicly, widget: boolean }
                  - { label: "accept new submissions while the artist is awaited", name: acceptWhileAwaiting, widget: boolean }
                  - { label: "announce milestones publicly (artist decision pending)", name: announceMilestones, widget: boolean }
                  - { label: "technical length limit (characters)", name: maxChars, widget: number, value_type: int }
              - label: "space in between us"
                name: between
                widget: object
                fields:
                  - { label: "open for contributions", name: open, widget: boolean }
                  - { label: title, name: title, widget: string }
                  - { label: prompt, name: prompt, widget: string }
                  - label: "moderation (artist decision pending)"
                    name: moderation
                    widget: select
                    options:
                      - { label: "read before publishing", value: pre }
                      - { label: "publish at once (screened)", value: post }
                  - { label: "artist intervenes every … stanzas (3 or 5 under consideration; empty = undecided)", name: interventionEvery, widget: number, value_type: int, required: false }
                  - { label: "enforce the artist's turn (off until approved)", name: enforceArtistTurn, widget: boolean }
                  - { label: "technical length limit (characters)", name: maxChars, widget: number, value_type: int }
              - label: "responses to poems"
                name: responses
                widget: object
                fields:
                  - { label: "open for responses", name: open, widget: boolean }
                  - label: moderation
                    name: moderation
                    widget: select
                    options:
                      - { label: "read before publishing", value: pre }
                      - { label: "publish at once (screened)", value: post }
                  - { label: heading, name: heading, widget: string }
                  - { label: prompt, name: prompt, widget: string }
                  - { label: "technical length limit (characters)", name: maxChars, widget: number, value_type: int }
                  - { label: "poems that invite responses", name: poems, widget: list, field: { label: poem, name: poem, widget: relation, collection: writing, value_field: "{{slug}}", search_fields: [title], display_fields: [title] } }
          - label: contact form
            name: contactForm
            widget: object
            fields:
              - { label: enabled, name: enabled, widget: boolean }
              - { label: "require reCAPTCHA", name: recaptcha, widget: boolean }
          - label: analytics
            name: analytics
            widget: object
            fields:
              - { label: "approved by the artist", name: approvedByArtist, widget: boolean, hint: "Nothing is measured until this is on." }
              - { label: provider, name: provider, widget: hidden }
              - { label: domain, name: domain, widget: string }
              - { label: "script url", name: scriptSrc, widget: string }
