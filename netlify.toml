[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The field's storage. During the private preview, every deploy (including the
# production deploy of claude/gilesmccrary-website-2ingnt) uses the test store
# "field-preview", so verification pieces never reach the real field.
# AT LAUNCH (and only then): change the production value below to "field".
# The literary works (unfinished sentence, space in between us) follow the same
# rule: "-preview" stores until launch; at launch, set the production suffix to "".
[context.production.environment]
  FIELD_STORE = "field-preview"
  WORKS_STORE_SUFFIX = "-preview"
[context.deploy-preview.environment]
  FIELD_STORE = "field-preview"
  WORKS_STORE_SUFFIX = "-preview"
[context.branch-deploy.environment]
  FIELD_STORE = "field-preview"
  WORKS_STORE_SUFFIX = "-preview"

# Redirect www to the bare domain (HTTPS is provisioned automatically by Netlify).
[[redirects]]
  from = "https://www.gilesmccrary.com/*"
  to = "https://gilesmccrary.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Optimised images and scripts have content hashes in their names: cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
